field:
  title:
    label: Title
    help: What to call this process, so it can be told from the others.
  type:
    label: Type
    help: The treatment to run. A bundle mounted in the board brings the code, and declaring it is what puts it in this list.
  selection:
    label: Selection
    help: The files the process runs on.
  severity:
    label: Severity
    help: How much what it finds matters.
    choice:
      warning:
        label: Warning — to look at, holds nothing up
      error:
        label: Error — to fix before going on
  options:
    label: Options
    help: 'What the type is told, as a JSON object — {"mode": "644"}. What the keys mean is the type''s own business.'

action:
  submit: Save

success:
  message: Process saved
